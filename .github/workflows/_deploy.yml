name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev | staging | prod)'
        required: true
        type: string
      artifact_name:
        description: 'GitHub Actions artifact name produced by the build job'
        required: true
        type: string
      tarball:
        description: 'Tarball filename (e.g. nestjs-dev.tar.gz)'
        required: true
        type: string
    secrets:
      HOST:
        required: true
      USERNAME:
        required: true
      PASSWORD:
        required: true

env:
  # DEPLOY_DIR comes from the GitHub Environment variable of the same name.
  # Set it in: Settings → Environments → <env> → Variables
  #
  #   dev     → /flowbrand/staging      (or wherever dev lives — ask B-Nockk)
  #   staging → /flowbrand/staging
  #   prod    → /flowbrand/production
  #
  # This means the workflow never needs to change when paths shift — update
  # the variable in the UI and the next run picks it up automatically.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
  PM2_ENV: ${{ inputs.environment == 'prod' && 'main' || inputs.environment }}
  REMOTE_TMP: /tmp/nestjs

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Ties this job to a GitHub Environment so you get:
    #   - protection rules (required reviewers, wait timers) on staging/prod
    #   - per-environment secret scoping if you ever need it
    #   - a clean deployment history in the GitHub UI
    environment: ${{ inputs.environment }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Copy tarball to server
        run: |
          echo "══════════════════════════════════════════"
          echo "  Copying ${{ inputs.tarball }} → ${{ secrets.HOST }}:${{ env.REMOTE_TMP }}"
          echo "══════════════════════════════════════════"
          sshpass -p "${{ secrets.PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            ${{ inputs.tarball }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ env.REMOTE_TMP }}/

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          envs: DEPLOY_DIR,PM2_ENV,REMOTE_TMP,TARBALL
          script: |
            set -euo pipefail

            TARBALL="${{ inputs.tarball }}"

            echo "══════════════════════════════════════════"
            echo "  Environment : ${{ inputs.environment }}"
            echo "  Deploy dir  : ${DEPLOY_DIR}"
            echo "  PM2 env     : ${PM2_ENV}"
            echo "══════════════════════════════════════════"

            cd "${DEPLOY_DIR}"

            echo "── Extracting tarball ─────────────────────"
            tar -xzf "${REMOTE_TMP}/${TARBALL}" -C .
            rm -f "${REMOTE_TMP}/${TARBALL}"

            echo "── Moving runtime files out of dist ───────"
            mv dist/package.json .
            mv dist/*-ecosystem-config.json .
            mv dist/deployment.sh .

            echo "── Running deployment script ──────────────"
            chmod +x deployment.sh
            ./deployment.sh "${PM2_ENV}"

            echo "══════════════════════════════════════════"
            echo "  ✅ Deploy complete (${{ inputs.environment }})"
            echo "══════════════════════════════════════════"
